[binaries]
# C compiler
c = 'x86_64-w64-mingw32-gcc'
# C++ compiler
cpp = 'x86_64-w64-mingw32-g++'
# binutils
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
# resource compiler for .rc files
windres = 'x86_64-w64-mingw32-windres'
# host pkg-config with the right env vars works fine
pkgconfig = 'pkg-config'

[host_machine]
# meson name for the target OS
system = 'windows'
# CPU architecture
cpu_family = 'x86_64'
# same here in this particular case
cpu = 'x86_64'
# byte order, aka endianness
endian = 'little'

[properties]
# exe suffix so meson names test programs correctly
exe_suffix = 'exe'
# everything else comes from our flags, nothing more needed
