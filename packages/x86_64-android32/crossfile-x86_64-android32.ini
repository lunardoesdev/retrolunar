[binaries]
# Compilers and binutils come from the environment: the system exports
# $CC, $CXX, $AR, $STRIP and $LD as full paths into the NDK, and the cross
# toolchain is deliberately kept off PATH, so bare names cannot resolve.
# Host pkg-config with the right env vars works fine.
pkgconfig = 'pkg-config'

[host_machine]
# meson name for the target OS; google: meson host_machine system android
system = 'android'
# CPU architecture
cpu_family = 'x86_64'
# same here in this particular case
cpu = 'x86_64'
# byte order, aka endianness
endian = 'little'

[properties]
# everything else comes from our flags, nothing more needed
